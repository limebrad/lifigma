# Публикация Vite-сборки на GitHub Pages (источник: GitHub Actions)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новый push отменяет предыдущий запуск
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vite 8 требует Node ^20.19.0 || >=22.12.0. Раньше стоял `node-version: 20`:
      # сборка проходила только потому, что 20.x резолвится в последний 20.19+,
      # а нижняя граница нигде не была зафиксирована. Пин на LTS-ветку и
      # engines в package.json делают требование явным.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Линт был настроен и описан в README, но не выполнялся в CI: регрессии
      # (например, неиспользуемые переменные между модулями, которые
      # tsc --noUnusedLocals не ловит) уезжали на прод молча.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
